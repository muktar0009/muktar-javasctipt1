<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password – Muktar JS</title>
  <link rel="stylesheet" href="../assets/shared.css">
  <link rel="icon" href="https://pdfa.org/wp-content/uploads/2023/11/VSCode-extension.jpg" type="image/x-icon">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { min-height: 100vh; display: flex; flex-direction: column; }
    .auth-container { flex: 1; display: flex; align-items: center; justify-content: center; padding: 7rem 1rem 3rem; animation: fadeInUp 0.7s ease forwards; opacity: 0; }
    .auth-box { background: rgba(0, 66, 92, 0.5); border: 1px solid rgba(78, 208, 240, 0.2); border-radius: 12px; padding: 2.5rem; width: 100%; max-width: 420px; backdrop-filter: blur(16px); }
    .auth-box h1 { font-size: 24px; color: var(--primary-color); margin-bottom: 0.5rem; }
    .auth-box p { color: rgba(255,251,224,0.6); font-size: 14px; margin-bottom: 2rem; }
    .back-link { display: inline-flex; align-items: center; gap: 6px; color: var(--primary-color); text-decoration: none; font-size: 14px; margin-top: 1rem; }
    .back-link:hover { text-decoration: underline; }
    .result-box { display: none; text-align: center; padding: 1rem; }
    .result-box .icon { font-size: 48px; margin-bottom: 1rem; }
    .result-box h3 { color: var(--success); margin-bottom: 0.5rem; }
    .result-box p { color: rgba(255,251,224,0.6); font-size: 14px; }
    .dev-link { margin-top: 1rem; padding: 0.8rem; background: rgba(0,66,92,0.5); border-radius: 6px; font-size: 13px; word-break: break-all; }
    .dev-link a { color: var(--primary-color); }
  </style>
</head>
<body>
  <nav class="navbar">
    <a href="../index.html"><img src="https://pdfa.org/wp-content/uploads/2023/11/VSCode-extension.jpg" class="logo" alt="logo"></a>
    <ul class="nav-menu"><li><a href="../index.html"><i class="fa-solid fa-house icone-currect"></i>&nbsp;Home</a></li></ul>
    <a href="login.html" class="loginbtn" id="lgbtn">Login</a>
    <div class="hamburger" id="hamburger"><span></span><span></span><span></span></div>
  </nav>

  <div class="auth-container">
    <div class="auth-box">
      <h1>🔑 Forgot Password</h1>
      <p>Enter your email address and we'll send you a reset link.</p>

      <form id="forgotForm">
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" id="fpEmail" placeholder="your@email.com" required>
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;" id="fpBtn">
          <i class="fa-regular fa-paper-plane"></i> Send Reset Link
        </button>
      </form>

      <div class="result-box" id="resultBox">
        <div class="icon">📬</div>
        <h3>Check Your Email!</h3>
        <p>If your email is registered, a reset link has been sent.</p>
        <div class="dev-link" id="devLink" style="display:none;"></div>
      </div>

      <a href="login.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Back to Login</a>
    </div>
  </div>

  <script src="../assets/shared.js"></script>
  <script>
    document.getElementById("forgotForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = document.getElementById("fpEmail").value.trim();
      const btn = document.getElementById("fpBtn");
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> Sending...';

      try {
        const data = await apiFetch("/auth/forgot-password", { method: "POST", body: { email } });
        document.getElementById("forgotForm").style.display = "none";
        document.getElementById("resultBox").style.display = "block";

        // Show dev link if available
        if (data.dev_link) {
          const dl = document.getElementById("devLink");
          dl.style.display = "block";
          dl.innerHTML = `<strong>Dev mode reset link:</strong><br><a href="${data.dev_link}">${data.dev_link}</a>`;
        }
      } catch (err) {
        showToast(err.message, "error");
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-regular fa-paper-plane"></i> Send Reset Link';
      }
    });
  </script>
</body>
</html>
