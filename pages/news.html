<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Articles – Muktar JS</title>
  <link rel="stylesheet" href="../assets/shared.css">
  <link rel="icon" href="https://pdfa.org/wp-content/uploads/2023/11/VSCode-extension.jpg" type="image/x-icon">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .news-wrapper {
      padding: 7rem 2rem 2rem;
      max-width: 1100px;
      margin: 0 auto;
      animation: fadeInUp 0.8s ease forwards;
      opacity: 0;
    }
    .news-header { display: flex; align-items: flex-end; justify-content: space-between; flex-wrap: wrap; gap: 1rem; margin-bottom: 2rem; }
    .news-header h1 { font-size: clamp(24px, 6vw, 48px); color: var(--primary-color); text-transform: uppercase; }
    .search-box {
      display: flex;
      gap: 8px;
      background: rgba(0, 66, 92, 0.4);
      border: 1px solid rgba(78, 208, 240, 0.2);
      border-radius: 6px;
      padding: 6px 12px;
      align-items: center;
    }
    .search-box input { background: none; border: none; outline: none; color: var(--pure); font-family: Saira, sans-serif; font-size: 15px; min-width: 200px; }
    .search-box input::placeholder { color: rgba(78, 208, 240, 0.4); }
    .search-box i { color: rgba(78, 208, 240, 0.5); }

    /* Filters */
    .filters { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 2rem; }
    .filter-btn {
      padding: 6px 18px;
      background: rgba(0, 66, 92, 0.4);
      border: 1px solid rgba(78, 208, 240, 0.2);
      border-radius: 20px;
      font-size: 13px;
      font-family: Saira, sans-serif;
      color: rgba(255,251,224,0.7);
      cursor: pointer;
      transition: 0.2s;
    }
    .filter-btn:hover, .filter-btn.active { background: var(--primary-color); color: var(--dark-ternary); border-color: var(--primary-color); font-weight: 600; }

    /* Grid */
    .news-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1.5rem; margin-bottom: 2rem; }
    .news-card {
      background: rgba(0, 66, 92, 0.4);
      border: 1px solid rgba(78, 208, 240, 0.15);
      border-radius: 8px;
      padding: 1.5rem;
      backdrop-filter: blur(8px);
      transition: border-color 0.2s, transform 0.2s;
      cursor: pointer;
      display: flex;
      flex-direction: column;
    }
    .news-card:hover { border-color: rgba(78, 208, 240, 0.5); transform: translateY(-4px); }
    .category-badge { display: inline-block; background: rgba(78, 208, 240, 0.1); color: var(--primary-color); border: 1px solid rgba(78, 208, 240, 0.3); border-radius: 20px; padding: 2px 12px; font-size: 12px; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 1px; align-self: flex-start; }
    .news-card h3 { font-size: 18px; margin-bottom: 10px; color: var(--pure); line-height: 1.4; flex: 1; }
    .news-card p { font-size: 13px; color: rgba(255,251,224,0.65); line-height: 1.6; margin-bottom: 1rem; }
    .card-meta { display: flex; justify-content: space-between; font-size: 12px; color: rgba(78, 208, 240, 0.6); margin-top: auto; }

    .news-skeleton { background: rgba(0, 66, 92, 0.3); border-radius: 8px; height: 220px; animation: pulse 1.5s ease infinite; }
    @keyframes pulse { 0%, 100% { opacity: 0.4; } 50% { opacity: 0.8; } }

    .pagination { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
    .page-btn {
      width: 38px; height: 38px;
      background: rgba(0, 66, 92, 0.4);
      border: 1px solid rgba(78, 208, 240, 0.2);
      border-radius: 4px;
      color: var(--pure);
      font-family: Saira, sans-serif;
      font-size: 14px;
      cursor: pointer;
      transition: 0.2s;
    }
    .page-btn:hover, .page-btn.active { background: var(--primary-color); color: var(--dark-ternary); border-color: var(--primary-color); }
    .page-btn:disabled { opacity: 0.3; cursor: not-allowed; }

    /* Article detail overlay */
    .article-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 16, 22, 0.95);
      z-index: 10000;
      overflow-y: auto;
      padding: 2rem;
      backdrop-filter: blur(20px);
    }
    .article-overlay.open { display: block; }
    .article-content { max-width: 760px; margin: 4rem auto; }
    .article-close { position: fixed; top: 1.5rem; right: 2rem; background: var(--dark-ternary); border: 1px solid rgba(78, 208, 240, 0.3); border-radius: 50%; width: 42px; height: 42px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 18px; z-index: 10001; transition: 0.2s; }
    .article-close:hover { background: var(--primary-color); color: var(--dark-ternary); }
    .article-content h1 { font-size: clamp(22px, 5vw, 40px); color: var(--primary-color); margin-bottom: 1rem; }
    .article-meta { display: flex; gap: 1.5rem; flex-wrap: wrap; color: rgba(78, 208, 240, 0.7); font-size: 14px; margin-bottom: 2rem; padding-bottom: 1rem; border-bottom: 1px solid rgba(78, 208, 240, 0.15); }
    .article-body { font-size: 16px; line-height: 1.9; color: rgba(255, 251, 224, 0.85); }
  </style>
</head>
<body>
  <nav class="navbar">
    <a href="../index.html"><img src="https://pdfa.org/wp-content/uploads/2023/11/VSCode-extension.jpg" class="logo" alt="logo"></a>
    <ul class="nav-menu">
      <li><a href="../index.html"><i class="fa-solid fa-house icone-currect"></i>&nbsp;Home</a></li>
      <li><a href="about.html"><i class="fa-solid fa-chart-column icone-currect"></i>&nbsp;About</a></li>
      <li><a href="contact.html"><i class="fa-solid fa-address-book icone-currect"></i>&nbsp;Contact</a></li>
      <li><a href="news.html" id="nav-selected"><i class="fa-solid fa-newspaper icone-currect"></i>&nbsp;Articles</a></li>
    </ul>
    <a href="login.html" class="loginbtn" id="lgbtn">Login</a>
    <div class="hamburger" id="hamburger"><span></span><span></span><span></span></div>
  </nav>

  <div class="news-wrapper">
    <div class="news-header">
      <h1><i class="fa-solid fa-newspaper"></i> Articles</h1>
      <div class="search-box">
        <i class="fa-solid fa-search"></i>
        <input type="text" id="searchInput" placeholder="Search articles...">
      </div>
    </div>

    <div class="filters" id="categoryFilters">
      <button class="filter-btn active" data-cat="">All</button>
    </div>

    <div class="news-grid" id="newsGrid">
      <div class="news-skeleton"></div>
      <div class="news-skeleton"></div>
      <div class="news-skeleton"></div>
    </div>

    <div class="pagination" id="pagination"></div>
  </div>

  <!-- Article detail overlay -->
  <div class="article-overlay" id="articleOverlay">
    <button class="article-close" onclick="closeArticle()"><i class="fa-solid fa-xmark"></i></button>
    <div class="article-content" id="articleContent"></div>
  </div>

  <footer class="site-footer">
    <div class="footer-container">
      <div class="footer-col">
        <h3>Muktar JS Practices</h3>
        <p>Creating digital experiences that matter.</p>
      </div>
      <div class="footer-col">
        <h3>Quick Links</h3>
        <ul>
          <li><a href="../index.html">Home</a></li>
          <li><a href="about.html">About</a></li>
          <li><a href="news.html">Articles</a></li>
          <li><a href="contact.html">Contact</a></li>
        </ul>
      </div>
      <div class="footer-col">
        <h3>Follow Us</h3>
        <div class="social-links">
          <a href="#"><i class="fab fa-facebook-f"></i></a>
          <a href="#"><i class="fab fa-twitter"></i></a>
          <a href="#"><i class="fab fa-instagram"></i></a>
          <a href="#"><i class="fab fa-github"></i></a>
        </div>
      </div>
    </div>
    <div class="footer-bottom">
      <p>&copy; 2025 Muktar JavaScript Practices. All rights reserved.</p>
    </div>
  </footer>

  <script src="../assets/shared.js"></script>
  <script>
    let currentPage = 1, currentCat = "", currentSearch = "";
    let searchTimeout;

    // ── Load categories ───────────────────────────────────────────────────────
    async function loadCategories() {
      try {
        const data = await fetch("/api/news/categories").then(r => r.json());
        const filters = document.getElementById("categoryFilters");
        data.categories.forEach(c => {
          const btn = document.createElement("button");
          btn.className = "filter-btn";
          btn.dataset.cat = c.category;
          btn.textContent = `${c.category} (${c.count})`;
          btn.onclick = () => { currentCat = c.category; currentPage = 1; loadArticles(); setActiveFilter(btn); };
          filters.appendChild(btn);
        });
      } catch (e) {}
    }

    function setActiveFilter(el) {
      document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
      el.classList.add("active");
    }

    document.querySelector(".filter-btn").onclick = () => {
      currentCat = ""; currentPage = 1; loadArticles();
      setActiveFilter(document.querySelector(".filter-btn"));
    };

    // ── Load articles ─────────────────────────────────────────────────────────
    async function loadArticles() {
      const grid = document.getElementById("newsGrid");
      grid.innerHTML = '<div class="news-skeleton"></div><div class="news-skeleton"></div><div class="news-skeleton"></div>';

      try {
        let url = `/api/news?page=${currentPage}&limit=9`;
        if (currentCat) url += `&category=${currentCat}`;
        if (currentSearch) url += `&search=${encodeURIComponent(currentSearch)}`;

        const data = await fetch(url).then(r => r.json());

        if (!data.posts?.length) {
          grid.innerHTML = '<p style="grid-column:1/-1;text-align:center;padding:3rem;color:rgba(255,251,224,0.4);">No articles found.</p>';
          document.getElementById("pagination").innerHTML = "";
          return;
        }

        grid.innerHTML = data.posts.map(p => `
          <div class="news-card" onclick="openArticle('${p.slug}')">
            <span class="category-badge">${p.category || 'General'}</span>
            <h3>${p.title}</h3>
            <p>${p.summary || ''}</p>
            <div class="card-meta">
              <span><i class="fa-regular fa-user"></i> ${p.author || 'Muktar'}</span>
              <span><i class="fa-regular fa-eye"></i> ${p.views || 0}</span>
              <span><i class="fa-regular fa-calendar"></i> ${formatDate(p.created_at)}</span>
            </div>
          </div>
        `).join("");

        // Pagination
        renderPagination(data.pages);
      } catch (e) {
        grid.innerHTML = '<p style="grid-column:1/-1;text-align:center;padding:3rem;color:rgba(255,251,224,0.4);">Could not load articles. Make sure the backend server is running.</p>';
      }
    }

    function renderPagination(totalPages) {
      const pg = document.getElementById("pagination");
      if (totalPages <= 1) { pg.innerHTML = ""; return; }
      let html = `<button class="page-btn" onclick="goPage(${currentPage-1})" ${currentPage===1?"disabled":""}>‹</button>`;
      for (let i = 1; i <= totalPages; i++) {
        html += `<button class="page-btn ${i===currentPage?"active":""}" onclick="goPage(${i})">${i}</button>`;
      }
      html += `<button class="page-btn" onclick="goPage(${currentPage+1})" ${currentPage===totalPages?"disabled":""}>›</button>`;
      pg.innerHTML = html;
    }
    function goPage(n) { currentPage = n; loadArticles(); window.scrollTo(0, 0); }

    // ── Article detail ────────────────────────────────────────────────────────
    async function openArticle(slug) {
      const overlay = document.getElementById("articleOverlay");
      const content = document.getElementById("articleContent");
      content.innerHTML = '<div style="text-align:center;padding:4rem;"><div class="spinner" style="width:40px;height:40px;border-width:3px;"></div></div>';
      overlay.classList.add("open");
      document.body.style.overflow = "hidden";

      try {
        const data = await fetch(`/api/news/${slug}`).then(r => r.json());
        const p = data.post;
        content.innerHTML = `
          <span class="category-badge">${p.category}</span>
          <h1>${p.title}</h1>
          <div class="article-meta">
            <span><i class="fa-regular fa-user"></i> ${p.author_name || p.author || 'Muktar'}</span>
            <span><i class="fa-regular fa-calendar"></i> ${formatDate(p.created_at)}</span>
            <span><i class="fa-regular fa-eye"></i> ${p.views} views</span>
          </div>
          <div class="article-body">${p.content.replace(/\n/g, "<br>")}</div>
        `;
      } catch (e) {
        content.innerHTML = '<p style="text-align:center;padding:2rem;">Could not load article.</p>';
      }
    }

    function closeArticle() {
      document.getElementById("articleOverlay").classList.remove("open");
      document.body.style.overflow = "";
    }

    // Close on Escape
    document.addEventListener("keydown", e => { if (e.key === "Escape") closeArticle(); });

    // ── Search ────────────────────────────────────────────────────────────────
    document.getElementById("searchInput").addEventListener("input", e => {
      clearTimeout(searchTimeout);
      searchTimeout = setTimeout(() => {
        currentSearch = e.target.value.trim();
        currentPage = 1;
        loadArticles();
      }, 350);
    });

    // Check URL for slug
    const params = new URLSearchParams(window.location.search);
    if (params.get("slug")) {
      document.addEventListener("DOMContentLoaded", () => openArticle(params.get("slug")));
    }

    loadCategories();
    loadArticles();
  </script>
</body>
</html>
