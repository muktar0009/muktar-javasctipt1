<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password – Muktar JS</title>
  <link rel="stylesheet" href="../assets/shared.css">
  <link rel="icon" href="https://pdfa.org/wp-content/uploads/2023/11/VSCode-extension.jpg" type="image/x-icon">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { min-height: 100vh; display: flex; flex-direction: column; }
    .auth-container { flex: 1; display: flex; align-items: center; justify-content: center; padding: 7rem 1rem 3rem; animation: fadeInUp 0.7s ease forwards; opacity: 0; }
    .auth-box { background: rgba(0, 66, 92, 0.5); border: 1px solid rgba(78, 208, 240, 0.2); border-radius: 12px; padding: 2.5rem; width: 100%; max-width: 420px; backdrop-filter: blur(16px); }
    .auth-box h1 { font-size: 24px; color: var(--primary-color); margin-bottom: 0.5rem; }
    .auth-box p { color: rgba(255,251,224,0.6); font-size: 14px; margin-bottom: 2rem; }
    .password-wrapper { position: relative; }
    .password-wrapper input { padding-right: 44px; }
    .toggle-pw { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--primary-color); cursor: pointer; font-size: 15px; }
  </style>
</head>
<body>
  <nav class="navbar">
    <a href="../index.html"><img src="https://pdfa.org/wp-content/uploads/2023/11/VSCode-extension.jpg" class="logo" alt="logo"></a>
    <ul class="nav-menu"><li><a href="../index.html"><i class="fa-solid fa-house icone-currect"></i>&nbsp;Home</a></li></ul>
    <a href="login.html" class="loginbtn" id="lgbtn">Login</a>
    <div class="hamburger" id="hamburger"><span></span><span></span><span></span></div>
  </nav>

  <div class="auth-container">
    <div class="auth-box">
      <h1>🔒 Reset Password</h1>
      <p>Enter and confirm your new password below.</p>

      <div id="invalidMsg" style="display:none;text-align:center;padding:1.5rem;color:#ff4d6d;">
        <p>Invalid or expired reset link. <a href="forgot-password.html" style="color:var(--primary-color);">Request a new one</a>.</p>
      </div>

      <form id="resetForm">
        <div class="form-group">
          <label>New Password</label>
          <div class="password-wrapper">
            <input type="password" id="newPw" placeholder="Min. 6 characters" required>
            <button type="button" class="toggle-pw" onclick="togglePw('newPw', this)"><i class="fa-regular fa-eye"></i></button>
          </div>
        </div>
        <div class="form-group">
          <label>Confirm Password</label>
          <div class="password-wrapper">
            <input type="password" id="confirmPw" placeholder="Repeat new password" required>
            <button type="button" class="toggle-pw" onclick="togglePw('confirmPw', this)"><i class="fa-regular fa-eye"></i></button>
          </div>
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;" id="resetBtn">
          <i class="fa-solid fa-lock"></i> Reset Password
        </button>
      </form>
    </div>
  </div>

  <script src="../assets/shared.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const token = params.get("token");
    const email = params.get("email");

    if (!token || !email) {
      document.getElementById("resetForm").style.display = "none";
      document.getElementById("invalidMsg").style.display = "block";
    }

    function togglePw(id, btn) {
      const input = document.getElementById(id);
      const isHidden = input.type === "password";
      input.type = isHidden ? "text" : "password";
      btn.innerHTML = isHidden ? '<i class="fa-regular fa-eye-slash"></i>' : '<i class="fa-regular fa-eye"></i>';
    }

    document.getElementById("resetForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const new_password = document.getElementById("newPw").value;
      const confirmPw = document.getElementById("confirmPw").value;
      if (new_password !== confirmPw) return showToast("Passwords do not match.", "error");

      const btn = document.getElementById("resetBtn");
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> Updating...';

      try {
        const data = await apiFetch("/auth/reset-password", {
          method: "POST",
          body: { token, email, new_password }
        });
        showToast(data.message, "success");
        setTimeout(() => window.location.href = "login.html", 1500);
      } catch (err) {
        showToast(err.message, "error");
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-lock"></i> Reset Password';
      }
    });
  </script>
</body>
</html>
